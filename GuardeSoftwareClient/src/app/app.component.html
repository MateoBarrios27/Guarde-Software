<div *ngIf="!isLoginRoute; else loginOnly" class="app-shell h-screen w-full bg-slate-100 flex overflow-hidden">
  
  <app-sidebar
    class="z-50"
    [isOpen]="isSidebarOpen" 
    (closeSidebar)="closeSidebar()">
  </app-sidebar>

  <div class="flex-1 flex flex-col transition-all duration-300 ease-in-out ml-0 lg:ml-64 min-w-0 min-h-0">
    
    @defer (on timer(3000ms)) {
      <app-offline-banner></app-offline-banner>
    }

    <header class="app-header flex h-16 items-center gap-4 border-b bg-white px-6 shadow-sm flex-shrink-0">
      <button type="button" (click)="toggleSidebar()" class="app-menu-trigger text-gray-600 hover:text-gray-900 lg:hidden"
              [attr.aria-label]="isSidebarOpen ? 'Cerrar menú de navegación' : 'Abrir menú de navegación'"
              [attr.aria-expanded]="isSidebarOpen">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" class="h-5 w-5"><path d="M5 8h14M5 16h10"/></svg>
      </button>

      <h1 class="app-page-title text-lg font-semibold text-gray-900">{{ pageTitle }}</h1>

      <app-notification-inbox *ngIf="authService.isLoggedIn()" class="ml-auto"></app-notification-inbox>
    </header>

    <main id="main-scroll" class="app-main flex-1 min-w-0 min-h-0 overflow-auto p-6 pt-0 pb-0">
      <router-outlet></router-outlet>
    </main>
  </div>

  <div 
    *ngIf="isSidebarOpen"
    (click)="closeSidebar()"
    class="fixed inset-0 bg-black bg-opacity-50 z-40 lg:hidden"
  ></div>

</div>

<ng-template #loginOnly>
  <router-outlet></router-outlet>
</ng-template>

<!-- Cartel de advertencia del sistema (disponible en rutas autenticadas). -->
@if (!isLoginRoute && authService.isLoggedIn()) {
  @defer (on timer(3000ms)) {
    <app-system-alert-modal></app-system-alert-modal>
  }

  <!-- Avisos y contador del chat en vivo de la web, visibles desde cualquier pantalla. -->
  @defer (on timer(1500ms)) {
    <app-chat-notifier></app-chat-notifier>
  }
}

<app-delete-confirmation-modal></app-delete-confirmation-modal>
