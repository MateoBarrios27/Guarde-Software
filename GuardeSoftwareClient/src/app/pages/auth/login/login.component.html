<div class="login-page">
  <!-- Foto de marca: sólo acompaña en pantallas anchas -->
  <div class="login-photo" aria-hidden="true">
    <img
      src="assets/imgs/guardeloquequiera.png"
      alt=""
      class="h-full w-full object-cover"
    />
    <div class="login-photo__shade"></div>
  </div>

  <main class="login-panel">
    <!-- Bloque de marca: azul sólido; en celular continúa la franja de la hora -->
    <header class="login-brand">
      <span class="login-brand__logo">
        <img src="assets/icons/favicon.svg" alt="" class="h-9 w-9" />
      </span>
      <div class="min-w-0">
        <p class="login-brand__eyebrow">GuardeSoftware</p>
        <h1 class="login-brand__title">Guarde Lo Que Quiera</h1>
      </div>
    </header>

    <div class="login-body">
      <h2 class="login-heading">Ingresá a tu cuenta</h2>

      <div *ngIf="errorMessage" class="g-notice g-notice--error mt-4" role="alert">
        <app-icon name="alert-triangle" class="mt-0.5 h-4 w-4 flex-shrink-0"></app-icon>
        <span>{{ errorMessage }}</span>
      </div>

      <form id="loginForm" (ngSubmit)="submit()" class="mt-6 space-y-5">
        <div>
          <label for="username" class="g-label">Usuario</label>
          <div class="relative">
            <span class="login-field-icon">
              <app-icon name="user" class="h-4 w-4"></app-icon>
            </span>
            <input
              type="text"
              id="username"
              [(ngModel)]="userName"
              name="username"
              autocomplete="username"
              autocapitalize="none"
              [disabled]="loading"
              class="g-field login-field"
              placeholder="Nombre de usuario"
              required
            />
          </div>
        </div>

        <div>
          <label for="password" class="g-label">Contraseña</label>
          <div class="relative">
            <span class="login-field-icon">
              <app-icon name="lock" class="h-4 w-4"></app-icon>
            </span>
            <input
              type="password"
              id="password"
              [(ngModel)]="password"
              name="password"
              autocomplete="current-password"
              [disabled]="loading"
              class="g-field login-field login-field--toggle"
              placeholder="••••••••"
              required
            />
            <button
              type="button"
              (click)="togglePasswordVisibility()"
              class="login-toggle"
              [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
              [attr.aria-pressed]="showPassword"
            >
              <app-icon name="eye" class="h-4 w-4" [ngClass]="{'opacity-50': !showPassword}"></app-icon>
            </button>
          </div>
        </div>

        <button type="submit" [disabled]="loading" class="g-btn g-btn--primary g-btn--block login-submit">
          <span *ngIf="loading" class="inline-block h-4 w-4 animate-spin rounded-full border-2 border-current border-t-transparent"></span>
          <span>{{ loading ? 'Iniciando sesión...' : 'Ingresar' }}</span>
          <app-icon *ngIf="!loading" name="arrow-right" class="h-4 w-4"></app-icon>
        </button>
      </form>
    </div>
  </main>
</div>
