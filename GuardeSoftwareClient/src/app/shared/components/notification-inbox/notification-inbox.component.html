<div class="relative">
  <button
    type="button"
    (click)="toggle($event)"
    class="relative flex h-10 w-10 items-center justify-center rounded-xl text-slate-500 transition-colors hover:bg-slate-100 hover:text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-300"
    aria-label="Abrir notificaciones"
    [attr.aria-expanded]="isOpen"
    title="Notificaciones"
  >
    <app-icon name="bell" class="h-5 w-5"></app-icon>
    <span
      *ngIf="unreadCount > 0"
      class="absolute right-2 top-2 h-2.5 w-2.5 rounded-full border-2 border-white bg-red-500"
      aria-hidden="true"
    ></span>
    <span class="sr-only" *ngIf="unreadCount > 0">{{ unreadCount }} notificaciones sin leer</span>
  </button>

  <section
    *ngIf="isOpen"
    class="notification-panel fixed inset-x-3 top-[4.5rem] z-[80] overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-2xl sm:absolute sm:inset-x-auto sm:right-0 sm:top-12 sm:w-[26rem]"
    aria-label="Bandeja de notificaciones"
    (click)="$event.stopPropagation()"
  >
    <header class="flex items-center justify-between border-b border-slate-100 px-4 py-3.5">
      <div>
        <h2 class="text-sm font-bold text-slate-900">Notificaciones</h2>
        <p class="mt-0.5 text-xs text-slate-500">
          {{ unreadCount ? unreadCount + ' sin leer' : 'Todo al día' }}
        </p>
      </div>
      <button
        *ngIf="unreadCount > 0"
        type="button"
        (click)="markAllAsRead($event)"
        class="rounded-lg px-2.5 py-1.5 text-xs font-semibold text-blue-600 hover:bg-blue-50"
      >
        Marcar todas como leídas
      </button>
    </header>

    <div class="max-h-[min(32rem,calc(100vh-8rem))] overflow-y-auto">
      <div *ngIf="isLoading && notifications.length === 0" class="flex items-center justify-center gap-2 px-5 py-10 text-sm text-slate-500">
        <app-icon name="loader" class="h-5 w-5 animate-spin"></app-icon>
        Cargando notificaciones...
      </div>

      <button
        *ngFor="let notification of notifications; trackBy: trackById"
        type="button"
        (click)="openNotification(notification, $event)"
        class="group flex w-full gap-3 border-b border-slate-100 px-4 py-3.5 text-left transition-colors last:border-b-0 hover:bg-slate-50"
        [ngClass]="!notification.isRead ? 'bg-blue-50 hover:bg-blue-100/60' : ''"
      >
        <span class="mt-0.5 flex h-9 w-9 shrink-0 items-center justify-center rounded-xl" [ngClass]="iconClasses(notification)">
          <app-icon [name]="iconFor(notification)" class="h-[18px] w-[18px]"></app-icon>
        </span>

        <span class="min-w-0 flex-1">
          <span class="flex items-start justify-between gap-2">
            <span class="text-sm text-slate-900" [class.font-bold]="!notification.isRead" [class.font-semibold]="notification.isRead">
              {{ notification.title }}
            </span>
            <span *ngIf="!notification.isRead" class="mt-1.5 h-2 w-2 shrink-0 rounded-full bg-blue-600"></span>
          </span>
          <span class="mt-1 block text-xs leading-5 text-slate-600">{{ notification.message }}</span>
          <span class="mt-1.5 flex items-center gap-2 text-[11px] font-medium text-slate-400">
            {{ relativeDate(notification.createdAt) }}
            <span *ngIf="notification.actionUrl" class="text-blue-600 group-hover:underline">Ver detalle</span>
          </span>
        </span>
      </button>

      <div *ngIf="!isLoading && notifications.length === 0 && !hasLoadError" class="px-6 py-12 text-center">
        <div class="mx-auto mb-3 flex h-11 w-11 items-center justify-center rounded-full bg-slate-100 text-slate-400">
          <app-icon name="bell" class="h-5 w-5"></app-icon>
        </div>
        <p class="text-sm font-semibold text-slate-700">No hay notificaciones</p>
        <p class="mt-1 text-xs text-slate-500">Cuando haya algo para revisar va a aparecer acá.</p>
      </div>

      <div *ngIf="hasLoadError" class="px-6 py-8 text-center">
        <p class="text-sm font-semibold text-red-700">No se pudo cargar la bandeja</p>
        <button type="button" (click)="loadNotifications()" class="mt-2 text-xs font-semibold text-blue-600 hover:underline">
          Reintentar
        </button>
      </div>
    </div>
  </section>
</div>
