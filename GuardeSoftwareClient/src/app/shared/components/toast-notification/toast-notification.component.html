<!-- Mismo lenguaje que el aviso de UiAlertService: blanco, compacto, con el ícono en un cuadrado del color del resultado. -->
<div
  *ngIf="visible"
  class="fixed right-3 top-[max(1.25rem,env(safe-area-inset-top))] z-[10000] flex max-w-[min(24rem,calc(100vw-1.5rem))] items-center gap-3 rounded-2xl border border-slate-200 bg-white p-3 pr-4 font-sans text-[#172033] shadow-[0_18px_40px_-22px_rgba(15,23,42,0.5)] animate-fade-in-out sm:right-5"
  role="status"
  aria-live="polite"
>
  <span
    class="flex h-9 w-9 flex-shrink-0 items-center justify-center rounded-xl text-white"
    [ngClass]="type === 'success' ? 'bg-[#15803D]' : 'bg-[#E11D48]'"
    aria-hidden="true"
  >
    <app-icon [name]="type === 'success' ? 'check' : 'alert-triangle'" class="h-4 w-4"></app-icon>
  </span>
  <span class="min-w-0 text-sm font-bold leading-snug">{{ message }}</span>
</div>
