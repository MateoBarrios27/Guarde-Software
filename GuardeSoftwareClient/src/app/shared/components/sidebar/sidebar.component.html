<aside
  class="sidebar-shell fixed inset-y-0 left-0 z-50 w-64 transform transition-transform duration-300 ease-in-out lg:translate-x-0"
  [ngClass]="isOpen ? 'translate-x-0' : '-translate-x-full'"
>
  <div class="sidebar-surface flex h-full flex-col overflow-hidden">
    <header class="flex h-20 shrink-0 items-center justify-between px-5">
      <h1 class="truncate text-xl font-bold tracking-[-0.025em] text-white">GuardeSoftware</h1>

      <button
        type="button"
        (click)="closeSidebar.emit()"
        class="sidebar-close flex h-8 w-8 items-center justify-center lg:hidden"
        aria-label="Cerrar navegación"
      >
        <app-icon name="x" class="h-4 w-4"></app-icon>
      </button>
    </header>

    <div class="mx-5 h-px shrink-0 bg-white/10"></div>

    <nav class="sidebar-nav flex-1 overflow-y-auto px-3 py-4" aria-label="Navegación principal">
      <ng-container *ngFor="let item of menuItems">
        <div
          *ngIf="(item.path === '/settings' || item.path === '/cash') && (!item.adminOnly || authService.isAdmin())"
          class="mx-3 my-3 h-px bg-white/10"
          aria-hidden="true"
        ></div>

        <a
          *ngIf="!item.adminOnly || authService.isAdmin()"
          [routerLink]="item.path"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="onLinkClick()"
          class="sidebar-link group relative flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-left"
        >
          <span class="active-indicator absolute left-0 h-5 w-0.5 rounded-full" aria-hidden="true"></span>
          <span class="sidebar-icon flex h-8 w-8 shrink-0 items-center justify-center">
            <app-icon [name]="item.icon" class="h-[18px] w-[18px]"></app-icon>
          </span>
          <span class="min-w-0 truncate text-[13px] font-semibold tracking-[-0.01em]">{{ item.title }}</span>
        </a>
      </ng-container>
    </nav>

    <footer class="sidebar-footer shrink-0 px-4 py-4">
      <div class="flex items-center gap-3">
        <div class="user-avatar flex h-8 w-8 shrink-0 items-center justify-center rounded-full text-xs font-semibold">
          {{ userInitial }}
        </div>

        <div class="min-w-0 flex-1">
          <p class="truncate text-xs font-semibold leading-4 text-white">
            {{ (firstName + ' ' + lastName).trim() || userName }}
          </p>
          <p class="truncate text-[10px] font-normal leading-4 text-blue-100/70">{{ userName }}</p>
        </div>

        <button
          type="button"
          (click)="logout()"
          class="logout-button flex h-8 w-8 shrink-0 items-center justify-center rounded-md"
          aria-label="Cerrar sesión"
          title="Cerrar sesión"
        >
          <app-icon name="logout" class="h-4 w-4"></app-icon>
        </button>
      </div>
    </footer>
  </div>
</aside>
