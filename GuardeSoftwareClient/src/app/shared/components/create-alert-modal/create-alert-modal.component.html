<div class="g-overlay z-[9998]">
  <div
    class="g-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="create-alert-title"
    (click)="$event.stopPropagation()"
  >
    <header class="g-modal__header">
      <div class="g-modal__heading">
        <span class="g-modal__icon g-modal__icon--orange" aria-hidden="true">
          <app-icon name="megaphone" class="h-5 w-5"></app-icon>
        </span>
        <div class="min-w-0">
          <h2 id="create-alert-title" class="g-modal__title">Emitir advertencia</h2>
          <p class="g-modal__subtitle">Queda en la bandeja de todos los usuarios.</p>
        </div>
      </div>
      <button type="button" (click)="closeModal.emit()" class="g-modal__close" aria-label="Cerrar">
        <app-icon name="x" class="h-4 w-4"></app-icon>
      </button>
    </header>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="g-modal__form">
      <div class="g-modal__body space-y-5">

        <!-- La elegida se rellena de su color: así se ve con qué tono va a salir el cartel. -->
        <div>
          <span class="g-label">Nivel de severidad *</span>
          <div class="grid grid-cols-2 gap-2">
            <button
              *ngFor="let opt of severityOptions"
              type="button"
              (click)="selectSeverity(opt.value)"
              class="alert-severity"
              [ngClass]="opt.selectedClass"
              [class.is-selected]="form.get('severity')?.value === opt.value"
              [attr.aria-pressed]="form.get('severity')?.value === opt.value"
            >
              <app-icon [name]="opt.icon" class="alert-severity__icon h-5 w-5 flex-shrink-0" [ngClass]="opt.colorClass"></app-icon>
              <span class="min-w-0">
                <span class="alert-severity__label">{{ opt.label }}</span>
                <span class="alert-severity__description">{{ opt.description }}</span>
              </span>
            </button>
          </div>
        </div>

        <div>
          <label for="alert-title" class="g-label">
            Título *
            <span class="g-label__aside">(máx. 80 caracteres)</span>
          </label>
          <input
            id="alert-title"
            type="text"
            formControlName="title"
            placeholder="Ej.: Mantenimiento programado del sistema"
            maxlength="80"
            class="g-field"
            [class.g-field--invalid]="form.get('title')?.invalid && form.get('title')?.touched"
          />
          <div *ngIf="form.get('title')?.invalid && form.get('title')?.touched" class="g-error">
            El título debe tener entre 3 y 80 caracteres.
          </div>
        </div>

        <div>
          <label for="alert-message" class="g-label">
            Mensaje *
            <span class="g-label__aside">(máx. 500 caracteres)</span>
          </label>
          <textarea
            id="alert-message"
            formControlName="message"
            placeholder="Ej.: El sistema estará en mantenimiento hoy de 14:00 a 16:00 hs. Guardá tu trabajo antes."
            rows="4"
            maxlength="500"
            class="g-field !resize-none"
            [class.g-field--invalid]="form.get('message')?.invalid && form.get('message')?.touched"
          ></textarea>
          <div class="mt-1 flex items-start justify-between gap-3">
            <div *ngIf="form.get('message')?.invalid && form.get('message')?.touched" class="g-error !mt-0">
              El mensaje debe tener entre 5 y 500 caracteres.
            </div>
            <span class="ml-auto text-xs font-semibold tabular-nums text-slate-400">
              {{ form.get('message')?.value?.length ?? 0 }}/500
            </span>
          </div>
        </div>

        <p class="g-notice">
          <app-icon name="user" class="mt-0.5 h-4 w-4 flex-shrink-0"></app-icon>
          Sale con tu nombre de usuario como emisor.
        </p>

        <div
          *ngIf="feedbackMessage"
          class="g-notice"
          [ngClass]="feedbackIsError ? 'g-notice--error' : 'g-notice--success'"
          [attr.role]="feedbackIsError ? 'alert' : 'status'"
        >
          {{ feedbackMessage }}
        </div>
      </div>

      <footer class="g-modal__footer">
        <button type="button" (click)="closeModal.emit()" class="g-btn g-btn--secondary">
          Cancelar
        </button>
        <button type="submit" [disabled]="form.invalid || isLoading" class="g-btn g-btn--warning">
          <app-icon *ngIf="!isLoading" name="send" class="h-4 w-4"></app-icon>
          <app-icon *ngIf="isLoading" name="loader" class="h-4 w-4 animate-spin"></app-icon>
          {{ isLoading ? 'Enviando...' : 'Emitir advertencia' }}
        </button>
      </footer>
    </form>
  </div>
</div>
