<div class="g-overlay">
  <form
    [formGroup]="newMovementForm"
    (ngSubmit)="onSubmit()"
    (click)="$event.stopPropagation()"
    class="g-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="movement-modal-title"
  >
    <header class="g-modal__header">
      <div class="g-modal__heading">
        <span class="g-modal__icon" aria-hidden="true"><app-icon name="plus-square" class="h-5 w-5"></app-icon></span>
        <h3 id="movement-modal-title" class="g-modal__title">Nuevo movimiento</h3>
      </div>
      <button type="button" (click)="closeModal.emit()" class="g-modal__close" aria-label="Cerrar">
        <app-icon name="x" class="h-4 w-4"></app-icon>
      </button>
    </header>

    <div class="g-modal__body space-y-5">

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <label for="movement-type" class="g-label">Tipo de movimiento *</label>
          <select id="movement-type" formControlName="movementType" class="g-field">
            <option value="DEBITO">DEBITO (Deuda)</option>
            <option value="CREDITO">CREDITO (Pago)</option>
          </select>
        </div>

        <div>
          <label for="movement-amount" class="g-label">Monto *</label>
          <div class="g-field-group">
            <span class="g-field-group__symbol" aria-hidden="true">$</span>
            <input
              id="movement-amount"
              type="text"
              inputmode="decimal"
              appCurrencyFormat
              formControlName="amount"
              placeholder="0,00"
            />
          </div>
          <div *ngIf="newMovementForm.controls['amount'].invalid && newMovementForm.controls['amount'].touched" class="g-error">
            El monto debe ser mayor a 0.
          </div>
        </div>
      </div>

      <div class="g-panel">
        <div class="flex items-center justify-between gap-3">
          <span class="g-label !mb-0">Fecha del movimiento</span>
          <button type="button" class="g-btn g-btn--ghost g-btn--sm" (click)="toggleManualDate()">
            {{ manualDateEnabled ? 'Usar fecha actual' : 'Editar fecha' }}
          </button>
        </div>

        <p *ngIf="!manualDateEnabled" class="mt-1 text-xs text-slate-500">
          Se usa la fecha y hora actual al registrar.
        </p>

        <div *ngIf="manualDateEnabled" class="mt-2">
          <input
            type="date"
            [(ngModel)]="dateString"
            [ngModelOptions]="{standalone: true}"
            aria-label="Fecha del movimiento"
            class="g-field"
          />
        </div>
      </div>

      <div>
        <div
          #conceptAutocomplete
          class="relative"
          (focusout)="onConceptFocusOut($event)"
        >
          <label for="movement-concept" class="g-label">Concepto *</label>
          <textarea
            id="movement-concept"
            formControlName="concept"
            placeholder="Ej.: Ajuste manual, cobro de seguro"
            aria-label="Concepto del movimiento"
            aria-autocomplete="list"
            [attr.aria-expanded]="showConceptSuggestions"
            aria-controls="movement-concept-suggestions"
            (focus)="openConceptSuggestions()"
            (click)="openConceptSuggestions()"
            class="g-field !resize-none"
            rows="3"
          ></textarea>

          <div
            *ngIf="showConceptSuggestions"
            id="movement-concept-suggestions"
            role="listbox"
            aria-label="Sugerencias de concepto"
            class="absolute left-0 right-0 top-full z-30 mt-1 overflow-hidden rounded-xl border border-slate-200 bg-white shadow-[0_16px_40px_-20px_rgba(15,23,42,0.45)]"
          >
            <button
              *ngFor="let suggestion of conceptSuggestions"
              type="button"
              role="option"
              (mousedown)="$event.preventDefault()"
              (click)="selectConceptSuggestion(suggestion)"
              class="block min-h-[2.75rem] w-full border-b border-slate-100 px-3.5 py-2.5 text-left text-sm font-semibold text-slate-700 transition-colors last:border-b-0 hover:bg-[#2563EB] hover:text-white focus:bg-[#2563EB] focus:text-white focus:outline-none"
            >
              {{ suggestion }}
            </button>
          </div>
        </div>

        <div *ngIf="newMovementForm.controls['concept'].invalid && newMovementForm.controls['concept'].touched" class="g-error">
          El concepto es requerido.
        </div>
      </div>

    </div>

    <footer class="g-modal__footer">
      <button type="button" (click)="closeModal.emit()" class="g-btn g-btn--secondary">
        Cancelar
      </button>
      <button type="submit" [disabled]="isLoading || newMovementForm.invalid" class="g-btn g-btn--primary">
        <ng-container *ngIf="!isLoading">
          <app-icon name="check" class="h-4 w-4"></app-icon>
          Guardar movimiento
        </ng-container>
        <ng-container *ngIf="isLoading">
          <app-icon name="loader" class="h-4 w-4 animate-spin"></app-icon>
          Guardando...
        </ng-container>
      </button>
    </footer>
  </form>
</div>
