<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm"
>
  <form
    [formGroup]="newMovementForm"
    (ngSubmit)="onSubmit()"
    (click)="$event.stopPropagation()"
    class="w-full max-w-md bg-white rounded-2xl shadow-2xl relative animate-fadeIn"
  >
    <div class="flex items-center justify-between border-b p-5">
      <div class="flex items-center gap-3">
        <app-icon name="plus-square" class="h-6 w-6 text-blue-600"></app-icon>
        <h3 class="text-xl font-semibold text-gray-800">
          Nuevo Movimiento Manual
        </h3>
      </div>
      <button
        type="button"
        (click)="closeModal.emit()"
        class="text-gray-400 hover:text-gray-600"
      >
        <app-icon name="x" class="h-5 w-5"></app-icon>
      </button>
    </div>

    <div class="p-5 space-y-5">
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm text-gray-600 mb-1 font-medium">Tipo de Movimiento *</label>
          <select
            formControlName="movementType"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-white text-gray-700 focus:ring-2 focus:ring-blue-400 focus:outline-none"
          >
            <option value="DEBITO">DEBITO (Deuda)</option>
            <option value="CREDITO">CREDITO (Pago)</option>
          </select>
        </div>
        
        <div>
          <label class="block text-sm text-gray-600 mb-1 font-medium">Monto *</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 font-medium">$</span>
            <input
              type="text"
              appCurrencyFormat
              formControlName="amount"
              placeholder="0.00"
              class="w-full pl-7 pr-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none text-gray-700"
            />
          </div>
          <div *ngIf="newMovementForm.controls['amount'].invalid && newMovementForm.controls['amount'].touched" class="text-red-500 text-xs mt-1">
            El monto debe ser mayor a 0.
          </div>
        </div>
      </div>

      <div class="bg-gray-50 rounded-lg p-3 border border-gray-100">
        <div class="flex items-center justify-between mb-1.5">
          <label class="block text-sm text-gray-600 font-medium">Fecha del movimiento</label>
          <button
            type="button"
            class="text-xs text-blue-600 underline hover:text-blue-800 transition-colors"
            (click)="toggleManualDate()">
            {{ manualDateEnabled ? 'Usar fecha actual' : 'Editar fecha' }}
          </button>
        </div>

        <div *ngIf="!manualDateEnabled" class="text-xs text-gray-500">
          Se usará la fecha y hora actual al registrar.
        </div>

        <div *ngIf="manualDateEnabled" class="animate-fadeIn mt-2">
          <input
            type="date"
            [(ngModel)]="dateString"
            [ngModelOptions]="{standalone: true}"
            class="w-full p-2 border border-gray-300 rounded-lg bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400 shadow-sm transition-all"
          />
        </div>
      </div>
      <div>
        <div class="relative">
          <label class="block text-sm text-gray-600 mb-1 font-medium">Concepto *</label>
          <textarea
            id="movement-concept"
            formControlName="concept"
            placeholder="Ej: Ajuste manual, cobro de seguro, etc."
            aria-label="Concepto del movimiento"
            aria-autocomplete="list"
            [attr.aria-expanded]="showConceptSuggestions"
            aria-controls="movement-concept-suggestions"
            (focus)="openConceptSuggestions()"
            (click)="openConceptSuggestions()"
            (blur)="scheduleCloseConceptSuggestions()"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-gray-700 focus:ring-2 focus:ring-blue-400 focus:outline-none resize-none"
            rows="3"
          ></textarea>

          <div
            *ngIf="showConceptSuggestions"
            id="movement-concept-suggestions"
            role="listbox"
            aria-label="Sugerencias de concepto"
            class="absolute left-0 right-0 top-full z-30 mt-1 overflow-hidden rounded-lg border border-gray-200 bg-white shadow-lg"
          >
            <button
              *ngFor="let suggestion of conceptSuggestions"
              type="button"
              role="option"
              (mousedown)="$event.preventDefault()"
              (click)="selectConceptSuggestion(suggestion)"
              class="block w-full border-b border-gray-100 px-3 py-2 text-left text-sm text-gray-700 transition-colors last:border-b-0 hover:bg-blue-50 hover:text-blue-700 focus:bg-blue-50 focus:text-blue-700 focus:outline-none"
            >
              {{ suggestion }}
            </button>
          </div>
        </div>

        <div *ngIf="newMovementForm.controls['concept'].invalid && newMovementForm.controls['concept'].touched" class="text-red-500 text-xs mt-1">
          El concepto es requerido.
        </div>
      </div>
      
    </div>

    <div class="mt-2 flex justify-end gap-3 border-t p-5 bg-gray-50 rounded-b-2xl">
      <button
        type="button"
        (click)="closeModal.emit()"
        class="px-4 py-2 rounded-lg border text-gray-700 bg-white hover:bg-gray-100 font-medium text-sm transition-colors"
      >
        Cancelar
      </button>
      <button
        type="submit"
        [disabled]="isLoading || newMovementForm.invalid"
        class="px-4 py-2 rounded-lg bg-blue-600 text-white font-medium hover:bg-blue-700 text-sm disabled:opacity-50 disabled:cursor-not-allowed transition-all"
      >
        <span *ngIf="!isLoading">Guardar Movimiento</span>
        <span *ngIf="isLoading" class="flex items-center gap-2">
            <app-icon name="loader" class="h-4 w-4 animate-spin"></app-icon>
            Guardando...
        </span>
      </button>
    </div>
  </form>
</div>
